name: Deploy to Google Cloud VM via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Setup SSH key
      run: |
        mkdir -p ~/.ssh
        echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H ${{ secrets.VM_HOST }} >> ~/.ssh/known_hosts

    - name: Deploy to Google Cloud VM
      run: |
        ssh ${{ secrets.VM_USER }}@${{ secrets.VM_HOST }} << EOF
          echo "🧹 Removing old project folder..."
          rm -rf ~/shipment-extractor

          echo "⬇️ Cloning latest code from GitHub..."
          git clone https://${{ secrets.GH_TOKEN }}@github.com/AmeerMH/test.git ~/shipment-extractor

          cd ~/shipment-extractor/test

          echo "🐳 Building Docker image..."
          docker build -t shipment-extractor .

          echo "🛑 Stopping old container if exists..."
          docker stop shipment-ai || true
          docker rm shipment-ai || true

          echo "🚀 Running new container..."
          docker run -d -p 5000:8080 \
            -v /home/${{ secrets.VM_USER }}/shipment-extractor/vertex-ai-access.json:/app/vertex-ai-access.json \
            -e GOOGLE_APPLICATION_CREDENTIALS=/app/vertex-ai-access.json \
            --name shipment-ai shipment-extractor

          echo "✅ Deployment complete!"
        EOF
